<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Requirement' : 'Add Requirement' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px; padding-top: 15px;">
    <form [formGroup]="requirementForm" (ngSubmit)="save()">

      <!-- Requirement Name (2-line input field) -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: flex-start;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Requirement Name:</label>
        </div>
        <div class="col-sm-8">
          <textarea class="form-control name back" rows="2" placeholder="Enter Requirement Name"
            formControlName="requirementName"
            style="font-size: 13px; line-height: 1.4; resize: vertical; min-height: 52px; height: 52px;"></textarea>
        </div>
      </div>

      <!-- Footer Actions -->
      <div style="margin-top: 20px; margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="requirementForm.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
