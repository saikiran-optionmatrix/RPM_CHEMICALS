<div class="NewHeader">
  <h1 mat-dialog-title>Stage Description</h1>
</div>

<div mat-dialog-content class="stage-desc-content">
  <!-- Code Badge & Name -->
  <div class="desc-header-row">
    <span class="stage-code-pill">{{ data?.stageCode || 'Stage' }}</span>
    <span class="stage-name-title">{{ data?.stageName || '' }}</span>
  </div>

  <!-- Description Details Card matching img2 -->
  <div class="desc-card">
    <div class="desc-card-label">DESCRIPTION DETAILS</div>
    <p class="desc-card-text">
      {{ data?.description || 'No description available for this stage.' }}
    </p>
  </div>
</div>

<div mat-dialog-actions class="stage-desc-actions">
  <button type="button" class="btn-close-custom" (click)="close()">
    Close
  </button>
</div>
