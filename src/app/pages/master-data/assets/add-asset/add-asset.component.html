<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Resource' : 'Add Resource' }}
  </h1>
</div>

<div mat-dialog-content style="padding: 16px 20px;">
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="myGroup" (ngSubmit)="upsertAsset()">

      <!-- Resource Name -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">Resource Name :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="50" placeholder="Enter Resource Name"
            formControlName="AssetName" type="text">
        </div>
      </div>

      <!-- Resource Code -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">Resource Code :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="50" placeholder="Enter Resource Code"
            formControlName="AssetCode" type="text">
        </div>
      </div>

      <!-- Availability (Multi-Select Weekdays) -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">Availability :</label>
        </div>
        <div class="col-sm-9">
          <mat-select multiple class="form-control back" placeholder="Select Weekdays"
            formControlName="availability">
            @for (day of weekdayOptions; track day) {
              <mat-option [value]="day">{{ day }}</mat-option>
            }
          </mat-select>
        </div>
      </div>

      <!-- From Time -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">From Time :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control back" type="time" formControlName="fromTime" placeholder="--:-- --">
        </div>
      </div>

      <!-- To Time -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">To Time :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control back" type="time" formControlName="toTime" placeholder="--:-- --">
        </div>
      </div>

      <!-- Actions -->
      <div style="margin-top: 20px; margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="myGroup.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
