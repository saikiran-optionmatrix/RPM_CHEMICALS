  <!-- Table using classes from AssetsComponent and global table CSS -->
  <div class="app-table-container" style="padding: 0 !important; width: 100%;">
    <div class="table-responsive" style="overflow-x: auto;">
      <table class="table app-table" style="width: 100%;">
        <thead>
          <tr>
            <th class="text-left">Weekday</th>
            <th class="text-center" style="width: 120px;">Available</th>
          </tr>
        </thead>
        <tbody>
          @for (item of weekdays; track item.day) {
            <tr>
              <td class="text-left" style="vertical-align: middle;">{{ item.day }}</td>
              <td class="text-center" style="vertical-align: middle;">
                <mat-checkbox [(ngModel)]="item.selected" color="primary"></mat-checkbox>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="empty-table">No records found</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<div mat-dialog-actions align="end" style="padding: 12px 20px; border-top: 1px solid #e2e8f0; gap: 10px;">
  <button type="button" class="app-btn app-btn-default" (click)="close()">
    <mat-icon>cancel</mat-icon> Close
  </button>
  <button type="button" class="app-btn app-btn-primary" (click)="save()">
    <mat-icon>save</mat-icon> Save
  </button>
</div>
