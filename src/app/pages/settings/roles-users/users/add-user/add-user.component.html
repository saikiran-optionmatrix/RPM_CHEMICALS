<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update User' : 'Add User' }}
  </h1>
</div>

<form [formGroup]="userForm" (ngSubmit)="saveUser()" class="add-user-form">
  <div mat-dialog-content class="add-user-content">
    <div class="col-sm-12" style="padding: 0;">
      <div class="row">

        <!-- Left Column -->
        <div class="col-sm-6">

          <!-- User Name -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">User Name :</label>
            </div>
            <div class="col-sm-8">
              <input class="form-control name back" maxlength="50" placeholder="Enter User Name"
                     formControlName="userName" type="text">
            </div>
          </div>

          <!-- Short Form -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Short Form :</label>
            </div>
            <div class="col-sm-8">
              <input class="form-control name back" maxlength="10" placeholder="Enter Short Form (e.g. PK)"
                     formControlName="shortForm" type="text">
            </div>
          </div>

          <!-- Email -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Email :</label>
            </div>
            <div class="col-sm-8">
              <input class="form-control name back" maxlength="80" placeholder="Enter Email"
                     formControlName="email" type="email">
            </div>
          </div>

          <!-- Phone Number -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Phone Number :</label>
            </div>
            <div class="col-sm-8">
              <input class="form-control name back" maxlength="15" placeholder="Enter Phone No"
                     formControlName="phone" type="text">
            </div>
          </div>

          <!-- Role -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Role :</label>
            </div>
            <div class="col-sm-8">
              <select class="form-control name back" formControlName="role">
                <option value="" disabled selected>Select Role</option>
                @for (rl of roles; track rl) {
                  <option [value]="rl">{{ rl }}</option>
                }
              </select>
            </div>
          </div>

        </div>

        <!-- Right Column -->
        <div class="col-sm-6">

          <!-- Department -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Department :</label>
            </div>
            <div class="col-sm-8">
              <select class="form-control name back" formControlName="department">
                <option value="" disabled selected>Select Department</option>
                @for (dept of departments; track dept) {
                  <option [value]="dept">{{ dept }}</option>
                }
              </select>
            </div>
          </div>

          <!-- Section -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Section :</label>
            </div>
            <div class="col-sm-8">
              <select class="form-control name back" formControlName="section">
                <option value="" disabled selected>Select Section</option>
                @for (sec of sections; track sec) {
                  <option [value]="sec">{{ sec }}</option>
                }
              </select>
            </div>
          </div>

          <!-- Work Hours -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Work Hours :</label>
            </div>
            <div class="col-sm-8">
              <input class="form-control name back" min="1" max="24" placeholder="8"
                     formControlName="workHours" type="number">
            </div>
          </div>

          <!-- Manager -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center;">
            <div class="col-sm-4">
              <label class="add-member-label control-label" style="margin-top: 5px; white-space: nowrap;">Managers :</label>
            </div>
            <div class="col-sm-8">
              <mat-select
                multiple
                class="form-control name back manager-select"
                formControlName="manager"
                placeholder="Select Managers"
                panelClass="manager-select-panel">
                <div class="manager-search-box" (keydown)="$event.stopPropagation()">
                  <!-- <mat-icon class="search-icon">search</mat-icon> -->
                  <input
                    type="text"
                    class="form-control manager-search-input"
                    placeholder="Search Manager..."
                    [(ngModel)]="managerSearchTerm"
                    [ngModelOptions]="{standalone: true}"
                    (click)="$event.stopPropagation()"
                    (keydown)="$event.stopPropagation()"
                  />
                  @if (managerSearchTerm) {
                    <button type="button" class="clear-search-btn" (click)="managerSearchTerm = ''; $event.stopPropagation()">
                      <mat-icon>close</mat-icon>
                    </button>
                  }
                </div>
                @for (mgr of filteredManagers; track mgr) {
                  <mat-option [value]="mgr">{{ mgr }}</mat-option>
                }
                @if (filteredManagers.length === 0) {
                  <div class="no-managers-found">No managers found</div>
                }
              </mat-select>
            </div>
          </div>

          <!-- Checkboxes: Manager, Project, CFT -->
          <div class="row" style="margin-bottom: 12px; display: flex; align-items: center; min-height: 34px;">
            <div class="col-sm-12" style="display: flex; align-items: center; gap: 24px; padding-left: 15px;">
              <div style="display: inline-flex; align-items: center; gap: 8px;">
                <label class="control-label" style="margin: 0; cursor: pointer;">Manager :</label>
                <mat-checkbox formControlName="managerialRole" color="primary"></mat-checkbox>
              </div>
              <div style="display: inline-flex; align-items: center; gap: 8px;">
                <label class="control-label" style="margin: 0; cursor: pointer;">Project :</label>
                <mat-checkbox formControlName="project" color="primary"></mat-checkbox>
              </div>
              <div style="display: inline-flex; align-items: center; gap: 8px;">
                <label class="control-label" style="margin: 0; cursor: pointer;">CFT :</label>
                <mat-checkbox formControlName="cft" color="primary"></mat-checkbox>
              </div>
            </div>
          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- Action Buttons pinned outside scrollable content -->
  <div mat-dialog-actions class="add-user-actions">
    <button type="button" class="app-btn app-btn-default" (click)="close()" style="background-color: lightgray; color: red;">
      <mat-icon>cancel</mat-icon> Close
    </button>
    <button type="submit" class="app-btn app-btn-primary" [disabled]="userForm.invalid">
      <mat-icon>save</mat-icon> Save
    </button>
  </div>
</form>
