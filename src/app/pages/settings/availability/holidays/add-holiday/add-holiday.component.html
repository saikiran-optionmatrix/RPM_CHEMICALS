<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Holiday' : 'Add Holiday' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="holidayForm" (ngSubmit)="saveHoliday()">

      <!-- Date Input Field -->
      <div class="row" style="margin-bottom: 20px; margin-top: 10px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Date :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control back" formControlName="date" type="date" style="height: 35px;">
        </div>
      </div>

      <!-- Description Input Field -->
      <div class="row" style="margin-bottom: 25px;">
        <div class="col-sm-3">
          <label class="add-member-label control-label" style="margin-top: 5px;">Description :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="150" placeholder="Enter Holiday Description"
            formControlName="description" type="text" style="height: 35px;">
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()"
            style="background-color: lightgray; color: red;">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="holidayForm.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
