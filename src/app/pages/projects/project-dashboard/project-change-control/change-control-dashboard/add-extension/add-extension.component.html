<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Extension' : 'Add Extension' }}
  </h1>
</div>

<div mat-dialog-content style="padding: 16px 20px;">
  <div class="col-sm-12" style="margin-bottom: 10px;">
    <form [formGroup]="form" (ngSubmit)="save()">

      <!-- Comments (text box) -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">Comments :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control name back" maxlength="150" placeholder="Enter Comments"
            formControlName="comments" type="text">
        </div>
      </div>

      <!-- Target Date -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">Target Date :</label>
        </div>
        <div class="col-sm-9">
          <input class="form-control back" type="date" formControlName="targetDate">
        </div>
      </div>

      <!-- Department (dropdown) -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">Department :</label>
        </div>
        <div class="col-sm-9">
          <select class="form-control back" formControlName="department">
            <option value="">Select Department</option>
            @for (dept of departments; track dept) {
              <option [value]="dept">{{ dept }}</option>
            }
          </select>
        </div>
      </div>

      <!-- HOD (dropdown) -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-3">
          <label class="add-member-label control-label">Hod :</label>
        </div>
        <div class="col-sm-9">
          <select class="form-control back" formControlName="hod">
            <option value="">Select HOD</option>
            @for (user of users; track user) {
              <option [value]="user">{{ user }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Signed & Signed Date (Visible only in edit mode, hidden in add mode) -->
      @if (isEditMode) {
        <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
          <div class="col-sm-3">
            <label class="control-label">Signed :</label>
          </div>
          <div class="col-sm-9">
            <mat-checkbox formControlName="signed" color="primary">
              
            </mat-checkbox>
          </div>
        </div>

        <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
          <div class="col-sm-3">
            <label class="control-label">Signed Date :</label>
          </div>
          <div class="col-sm-9">
            <input class="form-control back" type="date" formControlName="signedDate">
          </div>
        </div>
      }

      <!-- Actions -->
      <div style="margin-top: 24px; margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="form.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
