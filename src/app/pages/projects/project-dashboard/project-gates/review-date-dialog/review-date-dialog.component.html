<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ data?.title || 'Review Date' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px; padding-top: 15px;">
    <form (ngSubmit)="save()">
      <div class="row" style="margin-bottom: 20px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin: 0; font-weight: 500; font-size: 13px;">
            Review Date :
          </label>
        </div>
        <div class="col-sm-8">
          <input
            type="date"
            class="form-control name back"
            [(ngModel)]="reviewDate"
            name="reviewDate"
            required
            style="height: 36px;"
          />
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="!reviewDate">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
