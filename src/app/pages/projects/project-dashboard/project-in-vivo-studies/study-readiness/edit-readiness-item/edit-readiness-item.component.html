<div class="NewHeader">
  <h1 mat-dialog-title>Update Readiness Item</h1>
</div>

<div mat-dialog-content style="max-height: 75vh; overflow-y: auto;">
  <div class="col-sm-12" style="margin-bottom: 10px;">
    @if (data) {
      <p class="dialog-subnote">{{ data.studyId }} &middot; {{ data.title }}</p>
    }

    <form [formGroup]="readinessForm" (ngSubmit)="save()">
      <div class="row">
        <!-- Readiness Status -->
        <div class="col-sm-6">
          <div class="row" style="margin-bottom: 12px;">
            <div class="col-sm-5">
              <label class="add-member-label control-label" style="margin-top: 5px;">Readiness Status :</label>
            </div>
            <div class="col-sm-7">
              <mat-select class="form-control back" formControlName="status"
                style="height: 35px; line-height: 23px;">
                @for (st of statusOptions; track st) {
                  <mat-option [value]="st">{{ st }}</mat-option>
                }
              </mat-select>
              @if ((isSubmitting || f['status'].touched) && f['status'].errors?.['required']) {
                <small class="text-danger" style="color: #ef4444; font-size: 11px;">Required</small>
              }
            </div>
          </div>
        </div>

        <!-- Dynamic Readiness Item Fields -->
        @for (meta of fieldMetas; track meta.key) {
          <div class="col-sm-6">
            <div class="row" style="margin-bottom: 12px;">
              <div class="col-sm-5">
                <label class="control-label" style="margin-top: 5px;">{{ meta.label }} :</label>
              </div>
              <div class="col-sm-7">
                <input class="form-control name back"
                  [type]="meta.isDate ? 'date' : 'text'"
                  [formControlName]="meta.key"
                  style="height: 35px;">
              </div>
            </div>
          </div>
        }
      </div>

      <mat-dialog-actions align="end" style="padding: 12px 0 0; margin: 0;">
        <button type="button" class="app-btn app-btn-default" (click)="close()" style="margin-right: 10px;">
          <mat-icon>cancel</mat-icon> <span>Close</span>
        </button>
        <button type="submit" class="app-btn app-btn-primary">
          <mat-icon>save</mat-icon> <span>Save</span>
        </button>
      </mat-dialog-actions>
    </form>
  </div>
</div>
