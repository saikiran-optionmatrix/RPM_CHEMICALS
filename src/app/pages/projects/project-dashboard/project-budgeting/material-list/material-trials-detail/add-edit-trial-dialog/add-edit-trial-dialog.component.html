<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Edit ' + data.cycleLabel : 'Add New ' + data.cycleLabel }}
  </h1>
</div>

<div mat-dialog-content class="dialog-body">
  <form [formGroup]="form" (ngSubmit)="save()">

    <!-- Row 1: Cycle Label -->
    <div class="row">
      <div class="col-12 mb-3">
        <label class="control-label font-weight-bold">Cycle</label>
        <input type="text" class="form-control white" formControlName="cycleLabel" readonly>
      </div>
    </div>

    <!-- Row 2: Input quantity and Cost columns -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="control-label font-weight-bold">
          Input quantity {{ data.material.inu ? '(' + data.material.inu + ')' : '' }}
          <span class="text-danger">*</span>
        </label>
        <input type="number" step="0.001" class="form-control" placeholder="Enter input quantity" formControlName="inputQty">
        @if (isSubmitting && form.get('inputQty')?.invalid) {
          <div class="field-error">Valid input quantity is required</div>
        }
      </div>

      <div class="col-md-6 mb-3">
        <label class="control-label font-weight-bold">
          Cost (₹)
          <span class="text-danger">*</span>
        </label>
        <input type="number" step="1" class="form-control" placeholder="Enter cost" formControlName="cost">
        @if (isSubmitting && form.get('cost')?.invalid) {
          <div class="field-error">Valid cost is required</div>
        }
      </div>
    </div>

    <!-- Dialog Actions Footer -->
    <div class="dialog-actions-footer">
      <button type="button" class="app-btn app-btn-default" (click)="close()">
        <mat-icon>cancel</mat-icon> Close
      </button>
      <button type="submit" class="app-btn app-btn-primary">
        <mat-icon>save</mat-icon> {{ isEditMode ? 'Update' : 'Save' }}
      </button>
    </div>

  </form>
</div>
